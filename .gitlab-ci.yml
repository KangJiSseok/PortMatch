stages:
  - build
  - deploy

variables:
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
  DOCKER_DRIVER: overlay2
  BACKEND_IMAGE: "$DOCKERHUB_USERNAME/portmatch-backend"
  INFERENCE_IMAGE: "$DOCKERHUB_USERNAME/portmatch-inference"
  PORTFOLIO_IMAGE: "$DOCKERHUB_USERNAME/portmatch-portfolio-analysis"
  FRONTEND_IMAGE: "$DOCKERHUB_USERNAME/portmatch-frontend"
  EMBEDDING_IMAGE: "$DOCKERHUB_USERNAME/portmatch-embedding"
  EXPLANATION_IMAGE: "$DOCKERHUB_USERNAME/portmatch-explanation-llm"
  CRAWLER_IMAGE: "$DOCKERHUB_USERNAME/portmatch-wanted-crawler"

build:
  stage: build
  tags:
    - deploy
  image: docker:25.0
  services:
    - docker:25.0-dind
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_COMMIT_BRANCH == "ai-feat/jobposting-embedding"'

  script:
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
    - docker build -f Backend/Dockerfile -t "$BACKEND_IMAGE:$IMAGE_TAG" -t "$BACKEND_IMAGE:latest" Backend
    - docker push "$BACKEND_IMAGE:$IMAGE_TAG"
    - docker push "$BACKEND_IMAGE:latest"
    - docker build -f Inference/Dockerfile -t "$INFERENCE_IMAGE:$IMAGE_TAG" -t "$INFERENCE_IMAGE:latest" Inference
    - docker push "$INFERENCE_IMAGE:$IMAGE_TAG"
    - docker push "$INFERENCE_IMAGE:latest"
    - docker build -f Portfolio-Analysis/Dockerfile -t "$PORTFOLIO_IMAGE:$IMAGE_TAG" -t "$PORTFOLIO_IMAGE:latest" Portfolio-Analysis
    - docker push "$PORTFOLIO_IMAGE:$IMAGE_TAG"
    - docker push "$PORTFOLIO_IMAGE:latest"
    - docker build -f Frontend/Dockerfile -t "$FRONTEND_IMAGE:$IMAGE_TAG" -t "$FRONTEND_IMAGE:latest" Frontend
    - docker push "$FRONTEND_IMAGE:$IMAGE_TAG"
    - docker push "$FRONTEND_IMAGE:latest"
    - docker build -f Embedding/Dockerfile -t "$EMBEDDING_IMAGE:$IMAGE_TAG" -t "$EMBEDDING_IMAGE:latest" Embedding
    - docker push "$EMBEDDING_IMAGE:$IMAGE_TAG"
    - docker push "$EMBEDDING_IMAGE:latest"
    - docker build -f Explanation-LLM/Dockerfile -t "$EXPLANATION_IMAGE:$IMAGE_TAG" -t "$EXPLANATION_IMAGE:latest" Explanation-LLM
    - docker push "$EXPLANATION_IMAGE:$IMAGE_TAG"
    - docker push "$EXPLANATION_IMAGE:latest"
    - docker build -f crawler/DockerFile -t "$CRAWLER_IMAGE:$IMAGE_TAG" -t "$CRAWLER_IMAGE:latest" crawler
    - docker push "$CRAWLER_IMAGE:$IMAGE_TAG"
    - docker push "$CRAWLER_IMAGE:latest"

deploy:
  stage: deploy
  tags:
    - deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_COMMIT_BRANCH == "ai-feat/jobposting-embedding"'

  script:
    - set -e

    # ---------- 배포 디렉토리 ----------
    - mkdir -p /home/gitlab-runner/deploy
    - cd /home/gitlab-runner/deploy

    # ---------- docker-compose 파일 복사 ----------
    - cp $CI_PROJECT_DIR/docker-compose.prod.yml ./docker-compose.prod.yml

    # ---------- .env.prod 생성 ----------
    - |
      cat > .env.prod << ENV
      # ---------- ENV ----------
      APP_ENV=prod
      SPRING_PROFILES_ACTIVE=prod

      # ---------- DB ----------
      POSTGRES_DB=${POSTGRES_DB}
      POSTGRES_USER=${POSTGRES_USER}
      POSTGRES_PASSWORD=${POSTGRES_PASSWORD}

      SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      JPA_SHOW_SQL=${JPA_SHOW_SQL}
      HIBERNATE_FORMAT_SQL=${HIBERNATE_FORMAT_SQL}

      # ---------- AWS ----------
      AWS_S3_BUCKET=${AWS_S3_BUCKET}
      AWS_REGION=${AWS_REGION}
      AWS_ACCESS_KEY=${AWS_ACCESS_KEY}
      AWS_SECRET_KEY=${AWS_SECRET_KEY}

      # ---------- AI ----------
      OPENAI_API_KEY=${OPENAI_API_KEY}
      OPENAI_MODEL=${OPENAI_MODEL}
      OPENAI_BASE_URL=${OPENAI_BASE_URL}
      OPENAI_EMBEDDING_MODEL=${OPENAI_EMBEDDING_MODEL}
      GEMINI_API_KEY=${GEMINI_API_KEY}
      GEMINI_EMBEDDING_MODEL=${GEMINI_EMBEDDING_MODEL}
      GEMINI_OUTPUT_DIMENSIONS=${GEMINI_OUTPUT_DIMENSIONS}
      GEMINI_BASE_URL=${GEMINI_BASE_URL}

      LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2}
      LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
      LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT}
      LANGCHAIN_ENDPOINT=${LANGCHAIN_ENDPOINT}

      PPLX_API_KEY=${PPLX_API_KEY}
      PPLX_MODEL=${PPLX_MODEL}
      PPLX_BASE_URL=${PPLX_BASE_URL}

      # ---------- Internal Services ----------
      PORTFOLIO_ANALYSIS_URL=${PORTFOLIO_ANALYSIS_URL}
      COMPANY_PROJECT_ANALYSIS_URL=${COMPANY_PROJECT_ANALYSIS_URL}
      EMBEDDING_URL=${EMBEDDING_URL}
      EXPLANATION_URL=${EXPLANATION_URL}
      MINERU_ENDPOINT=${MINERU_ENDPOINT}

      # ---------- Frontend ----------
      VITE_API_BASE_URL=${VITE_API_BASE_URL}
      VITE_SERVICE_NAME=${VITE_SERVICE_NAME}
      VITE_OPENVIDU_PUBLIC_URL=${VITE_OPENVIDU_PUBLIC_URL}

      # ---------- Crawler ----------
      CRAWL_LIMIT=${CRAWL_LIMIT}
      DB_HOST=${DB_HOST}
      DB_PORT=${DB_PORT}

      ENV

    # ---------- 변경된 서비스 감지 ----------
    - |
      SERVICES=""
      CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r $CI_COMMIT_SHA || echo "")
      
      echo "$CHANGED_FILES" | grep -q "^Backend/" && SERVICES="$SERVICES backend"
      echo "$CHANGED_FILES" | grep -q "^Inference/" && SERVICES="$SERVICES inference"
      echo "$CHANGED_FILES" | grep -q "^Portfolio-Analysis/" && SERVICES="$SERVICES portfolio-analysis"
      echo "$CHANGED_FILES" | grep -q "^Frontend/" && SERVICES="$SERVICES frontend"
      echo "$CHANGED_FILES" | grep -q "^Embedding/" && SERVICES="$SERVICES embedding"
      echo "$CHANGED_FILES" | grep -q "^Explanation-LLM/" && SERVICES="$SERVICES explanation-llm"
      echo "$CHANGED_FILES" | grep -q "^crawler/" && SERVICES="$SERVICES wanted-crawler"
      
      echo "🔍 변경된 서비스: $SERVICES"

    # ---------- Docker 배포 ----------
    - docker login -u "$DOCKERHUB_USERNAME" -p "$DOCKERHUB_TOKEN"
    
    - |
      if [ -n "$SERVICES" ]; then
        echo "📦 배포할 서비스: $SERVICES"
        docker compose -f docker-compose.prod.yml pull $SERVICES
        docker compose -f docker-compose.prod.yml up -d --no-deps $SERVICES
      else
        echo "⚠️ 변경된 서비스가 없습니다."
      fi
    
    - docker image prune -f