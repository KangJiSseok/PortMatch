stages:
  - build
  - deploy

variables:
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
  DOCKER_DRIVER: overlay2
  GIT_DEPTH: 0  # Shallow clone 문제 방지 (전체 히스토리)
  BACKEND_IMAGE: "$DOCKERHUB_USERNAME/portmatch-backend"
  INFERENCE_IMAGE: "$DOCKERHUB_USERNAME/portmatch-inference"
  PORTFOLIO_IMAGE: "$DOCKERHUB_USERNAME/portmatch-portfolio-analysis"
  FRONTEND_IMAGE: "$DOCKERHUB_USERNAME/portmatch-frontend"
  EMBEDDING_IMAGE: "$DOCKERHUB_USERNAME/portmatch-embedding"
  EXPLANATION_IMAGE: "$DOCKERHUB_USERNAME/portmatch-explanation-llm"
  CRAWLER_IMAGE: "$DOCKERHUB_USERNAME/portmatch-wanted-crawler"

build:
  stage: build
  tags:
    - deploy
  image: docker:25.0
  services:
    - docker:25.0-dind
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_COMMIT_BRANCH == "be-feat/prometheus-monitoring"'
    - if: '$CI_COMMIT_BRANCH == "infra-hotfix/volumn-remove"'
    - if: '$CI_COMMIT_BRANCH == "infra/portfolio-analysis-distributed"'

  script:
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
    
    # ---------- 변경 감지 & 조건부 빌드 ----------
    - |
      # Git diff 범위 개선 (푸시된 전체 범위 체크)
      if [ -n "$CI_COMMIT_BEFORE_SHA" ] && [ "$CI_COMMIT_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
        # Shallow clone 에러 방지
        if CHANGED_FILES=$(git diff --name-only $CI_COMMIT_BEFORE_SHA $CI_COMMIT_SHA 2>/dev/null); then
          echo "✅ 전체 범위 변경 감지 성공"
        else
          echo "⚠️  Shallow clone으로 인해 전체 범위 확인 불가. 마지막 커밋만 체크합니다."
          CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r $CI_COMMIT_SHA)
        fi
      else
        CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r $CI_COMMIT_SHA)
      fi
      
      echo "📄 변경된 파일 (빌드):"
      echo "$CHANGED_FILES"
      echo "---"
      
      # Backend
      if echo "$CHANGED_FILES" | grep -q "^Backend/"; then
        echo "🔨 [1/7] Backend 빌드 중..."
        docker build -f Backend/Dockerfile -t "$BACKEND_IMAGE:$IMAGE_TAG" -t "$BACKEND_IMAGE:latest" Backend
        docker push "$BACKEND_IMAGE:$IMAGE_TAG"
        docker push "$BACKEND_IMAGE:latest"
      else
        echo "⏭️  [1/7] Backend - 변경 없음"
      fi
      
      # Inference
      if echo "$CHANGED_FILES" | grep -q "^Inference/"; then
        echo "🔨 [2/7] Inference 빌드 중..."
        docker build -f Inference/Dockerfile -t "$INFERENCE_IMAGE:$IMAGE_TAG" -t "$INFERENCE_IMAGE:latest" Inference
        docker push "$INFERENCE_IMAGE:$IMAGE_TAG"
        docker push "$INFERENCE_IMAGE:latest"
      else
        echo "⏭️  [2/7] Inference - 변경 없음"
      fi
      
      # Portfolio-Analysis
      if echo "$CHANGED_FILES" | grep -q "^Portfolio-Analysis/"; then
        echo "🔨 [3/7] Portfolio-Analysis 빌드 중..."
        docker build -f Portfolio-Analysis/Dockerfile -t "$PORTFOLIO_IMAGE:$IMAGE_TAG" Portfolio-Analysis
        docker push "$PORTFOLIO_IMAGE:$IMAGE_TAG"
        
        # ⭐ dev 브랜치이거나 현재 작업 중인 인프라 브랜치일 때 latest 갱신!
        if [ "$CI_COMMIT_BRANCH" == "dev" ] || [ "$CI_COMMIT_BRANCH" == "infra/portfolio-analysis-distributed" ]; then
          docker tag "$PORTFOLIO_IMAGE:$IMAGE_TAG" "$PORTFOLIO_IMAGE:latest"
          docker push "$PORTFOLIO_IMAGE:latest"
          echo "✅ 해당 브랜치: latest 태그 갱신 완료"
        fi
      else
        echo "⏭️  [3/7] Portfolio-Analysis - 변경 없음"
      fi
      
      # Frontend
      if echo "$CHANGED_FILES" | grep -q "^Frontend/"; then
        echo "🔨 [4/7] Frontend 빌드 중..."
        docker build -f Frontend/Dockerfile \
          --build-arg VITE_API_BASE_URL="$VITE_API_BASE_URL" \
          --build-arg VITE_SERVICE_NAME="$VITE_SERVICE_NAME" \
          --build-arg VITE_OPENVIDU_PUBLIC_URL="$VITE_OPENVIDU_PUBLIC_URL" \
          --build-arg VITE_FIREBASE_API_KEY="$VITE_FIREBASE_API_KEY" \
          --build-arg VITE_FIREBASE_AUTH_DOMAIN="$VITE_FIREBASE_AUTH_DOMAIN" \
          --build-arg VITE_FIREBASE_PROJECT_ID="$VITE_FIREBASE_PROJECT_ID" \
          --build-arg VITE_FIREBASE_STORAGE_BUCKET="$VITE_FIREBASE_STORAGE_BUCKET" \
          --build-arg VITE_FIREBASE_MESSAGING_SENDER_ID="$VITE_FIREBASE_MESSAGING_SENDER_ID" \
          --build-arg VITE_FIREBASE_APP_ID="$VITE_FIREBASE_APP_ID" \
          --build-arg VITE_FIREBASE_MEASUREMENT_ID="$VITE_FIREBASE_MEASUREMENT_ID" \
          -t "$FRONTEND_IMAGE:$IMAGE_TAG" -t "$FRONTEND_IMAGE:latest" Frontend
        docker push "$FRONTEND_IMAGE:$IMAGE_TAG"
        docker push "$FRONTEND_IMAGE:latest"
      else
        echo "⏭️  [4/7] Frontend - 변경 없음"
      fi
      
      # Embedding
      if echo "$CHANGED_FILES" | grep -q "^Embedding/"; then
        echo "🔨 [5/7] Embedding 빌드 중..."
        docker build -f Embedding/Dockerfile -t "$EMBEDDING_IMAGE:$IMAGE_TAG" -t "$EMBEDDING_IMAGE:latest" Embedding
        docker push "$EMBEDDING_IMAGE:$IMAGE_TAG"
        docker push "$EMBEDDING_IMAGE:latest"
      else
        echo "⏭️  [5/7] Embedding - 변경 없음"
      fi
      
      # Explanation-LLM
      if echo "$CHANGED_FILES" | grep -q "^Explanation-LLM/"; then
        echo "🔨 [6/7] Explanation-LLM 빌드 중..."
        docker build -f Explanation-LLM/Dockerfile -t "$EXPLANATION_IMAGE:$IMAGE_TAG" -t "$EXPLANATION_IMAGE:latest" Explanation-LLM
        docker push "$EXPLANATION_IMAGE:$IMAGE_TAG"
        docker push "$EXPLANATION_IMAGE:latest"
      else
        echo "⏭️  [6/7] Explanation-LLM - 변경 없음"
      fi
      
      # Crawler
      if echo "$CHANGED_FILES" | grep -q "^crawler/"; then
        echo "🔨 [7/7] Crawler 빌드 중..."
        docker build -f crawler/DockerFile -t "$CRAWLER_IMAGE:$IMAGE_TAG" -t "$CRAWLER_IMAGE:latest" crawler
        docker push "$CRAWLER_IMAGE:$IMAGE_TAG"
        docker push "$CRAWLER_IMAGE:latest"
      else
        echo "⏭️  [7/7] Crawler - 변경 없음"
      fi
      
      echo "✅ 빌드 완료!"

deploy:
  stage: deploy
  tags:
    - deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_COMMIT_BRANCH == "be-feat/prometheus-monitoring"'
    - if: '$CI_COMMIT_BRANCH == "infra-hotfix/volumn-remove"'
    - if: '$CI_COMMIT_BRANCH == "infra/portfolio-analysis-distributed"'

  script:
    - set -e

    # ---------- 변경된 서비스 감지 (디렉토리 이동 전!) ----------
    - |
      SERVICES=""
      
      # Git diff 범위 개선 (푸시된 전체 범위 체크)
      if [ -n "$CI_COMMIT_BEFORE_SHA" ] && [ "$CI_COMMIT_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
        # Shallow clone 에러 방지
        if CHANGED_FILES=$(git diff --name-only $CI_COMMIT_BEFORE_SHA $CI_COMMIT_SHA 2>/dev/null); then
          echo "✅ 전체 범위 변경 감지 성공"
        else
          echo "⚠️  Shallow clone으로 인해 전체 범위 확인 불가. 마지막 커밋만 체크합니다."
          CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r $CI_COMMIT_SHA)
        fi
      else
        CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r $CI_COMMIT_SHA)
      fi
      
      echo "📄 변경된 파일 (배포):"
      echo "$CHANGED_FILES"
      echo "---"
      
      # 각 서비스별 변경 감지
      echo "$CHANGED_FILES" | grep -q "^Backend/" && SERVICES="$SERVICES backend"
      echo "$CHANGED_FILES" | grep -q "^Inference/" && SERVICES="$SERVICES inference"
      echo "$CHANGED_FILES" | grep -q "^Frontend/" && SERVICES="$SERVICES frontend"
      echo "$CHANGED_FILES" | grep -q "^Embedding/" && SERVICES="$SERVICES embedding"
      echo "$CHANGED_FILES" | grep -q "^Explanation-LLM/" && SERVICES="$SERVICES explanation-llm"
      echo "$CHANGED_FILES" | grep -q "^crawler/" && SERVICES="$SERVICES wanted-crawler"
      
      # Portfolio-Analysis 변경 감지 (브랜치별 분기)
      if echo "$CHANGED_FILES" | grep -q "^Portfolio-Analysis/"; then
        # ⭐ 현재 브랜치 이름을 정확하게 넣어줘야 배포 대상에 포함돼!
        if [ "$CI_COMMIT_BRANCH" == "infra/portfolio-analysis-distributed" ]; then
          echo "🧪 테스트 브랜치: 테스트 서버 배포 목록 추가"
          SERVICES="$SERVICES portfolio-analysis-test celery-worker-test"
        elif [ "$CI_COMMIT_BRANCH" == "dev" ]; then
          echo "🚀 운영 브랜치: 모든 서버 업데이트"
          SERVICES="$SERVICES portfolio-analysis portfolio-analysis-test celery-worker-test"
        fi
      fi

      # docker-compose.prod.yml 변경 감지
      if echo "$CHANGED_FILES" | grep -q "docker-compose.prod.yml"; then
        echo "⚙️ 설정 파일 변경 감지"
        if [ "$CI_COMMIT_BRANCH" == "infra/portfolio-analysis-distributed" ]; then
           SERVICES="$SERVICES redis portfolio-analysis-test celery-worker-test"
        else
           SERVICES="$SERVICES redis portfolio-analysis portfolio-analysis-test celery-worker-test"
        fi
      fi

      # monitoring 파일 변경 감지
      if echo "$CHANGED_FILES" | grep -q "^monitoring/"; then
        echo "📊 모니터링 설정 파일 변경 감지"
        SERVICES="$SERVICES prometheus grafana"
      fi

      if [ "$CI_COMMIT_BRANCH" == "infra/portfolio-analysis-distributed" ]; then
        SERVICES="$SERVICES portfolio-analysis-test celery-worker-test redis"
      fi

      echo "🔍 최종 배포 대상 서비스: $SERVICES"

      echo "🔍 최종 배포 대상 서비스: $SERVICES"

    # ---------- 배포 디렉토리 ----------
    - mkdir -p /home/gitlab-runner/deploy
    - cd /home/gitlab-runner/deploy

    # ---------- docker-compose 파일 복사 ----------
    - cp $CI_PROJECT_DIR/docker-compose.prod.yml ./docker-compose.prod.yml
    
    # ---------- monitoring 설정 파일 복사 (be-feat/prometheus-monitoring 브랜치에서 추가된 부분) ----------
    - mkdir -p ./monitoring
    - cp $CI_PROJECT_DIR/monitoring/prometheus.yml ./monitoring/prometheus.yml

    # ---------- .env.prod 생성 ----------
    - |
      cat > .env.prod << ENV
      # ---------- ENV ----------
      APP_ENV=prod
      SPRING_PROFILES_ACTIVE=prod
      REDIS_PASSWORD=${REDIS_PASSWORD}

      # ---------- DB ----------
      POSTGRES_DB=${POSTGRES_DB}
      POSTGRES_USER=${POSTGRES_USER}
      POSTGRES_PASSWORD=${POSTGRES_PASSWORD}

      SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      JPA_SHOW_SQL=${JPA_SHOW_SQL}
      HIBERNATE_FORMAT_SQL=${HIBERNATE_FORMAT_SQL}

      # ---------- AWS ----------
      AWS_S3_BUCKET=${AWS_S3_BUCKET}
      AWS_REGION=${AWS_REGION}
      AWS_ACCESS_KEY=${AWS_ACCESS_KEY}
      AWS_SECRET_KEY=${AWS_SECRET_KEY}

      # ---------- AI ----------
      OPENAI_API_KEY=${OPENAI_API_KEY}
      OPENAI_MODEL=${OPENAI_MODEL}
      OPENAI_BASE_URL=${OPENAI_BASE_URL}
      OPENAI_EMBEDDING_MODEL=${OPENAI_EMBEDDING_MODEL}
      GEMINI_API_KEY=${GEMINI_API_KEY}
      GEMINI_EMBEDDING_MODEL=${GEMINI_EMBEDDING_MODEL}
      GEMINI_OUTPUT_DIMENSIONS=${GEMINI_OUTPUT_DIMENSIONS}
      GEMINI_BASE_URL=${GEMINI_BASE_URL}

      LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2}
      LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
      LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT}
      LANGCHAIN_ENDPOINT=${LANGCHAIN_ENDPOINT}

      PPLX_API_KEY=${PPLX_API_KEY}
      PPLX_MODEL=${PPLX_MODEL}
      PPLX_BASE_URL=${PPLX_BASE_URL}

      # ---------- Internal Services ----------
      PORTFOLIO_ANALYSIS_URL=${PORTFOLIO_ANALYSIS_URL}
      COMPANY_PROJECT_ANALYSIS_URL=${COMPANY_PROJECT_ANALYSIS_URL}
      EMBEDDING_URL=${EMBEDDING_URL}
      EXPLANATION_URL=${EXPLANATION_URL}
      MINERU_ENDPOINT=http://172.26.11.179:18001/file_parse
      MINERU_ENDPOINTS=http://172.26.11.179:18001/file_parse

      # ---------- Frontend ----------
      VITE_API_BASE_URL=${VITE_API_BASE_URL}
      VITE_SERVICE_NAME=${VITE_SERVICE_NAME}
      VITE_OPENVIDU_PUBLIC_URL=${VITE_OPENVIDU_PUBLIC_URL}
      VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY}
      VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN}
      VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID}
      VITE_FIREBASE_STORAGE_BUCKET=${VITE_FIREBASE_STORAGE_BUCKET}
      VITE_FIREBASE_MESSAGING_SENDER_ID=${VITE_FIREBASE_MESSAGING_SENDER_ID}
      VITE_FIREBASE_APP_ID=${VITE_FIREBASE_APP_ID}
      VITE_FIREBASE_MEASUREMENT_ID=${VITE_FIREBASE_MEASUREMENT_ID}
      
      # ---------- Grafana ----------
      GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}

      # ---------- Crawler ----------
      CRAWL_LIMIT=${CRAWL_LIMIT}
      DB_HOST=${DB_HOST}
      DB_PORT=${DB_PORT}

      # ---------- Redis ----------
      REDIS_PASSWORD=${REDIS_PASSWORD}

      ENV

    # ---------- Docker 배포 ----------
    - docker login -u "$DOCKERHUB_USERNAME" -p "$DOCKERHUB_TOKEN"
    
    - |
      if [ -n "$SERVICES" ]; then
        echo "📦 배포할 서비스:$SERVICES"
        docker compose -f docker-compose.prod.yml pull $SERVICES
        docker compose -f docker-compose.prod.yml up -d --no-deps --force-recreate $SERVICES
        echo "✅ 배포 완료!"
      else
        echo "⚠️ 변경된 서비스가 없습니다."
      fi
    
    - docker image prune -f