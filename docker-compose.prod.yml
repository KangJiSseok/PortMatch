version: "3.8"

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: portmatch-db
    restart: always
    ports:
      - "8100:5432"
    env_file:
      - .env.prod
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    image: gradle:8-jdk21
    container_name: portmatch-backend
    working_dir: /app/Backend
    volumes:
      - ./Backend:/app/Backend
    env_file:
      - .env.prod
    ports:
      - "8102:8080"
    depends_on:
      - db
      - portfolio-analysis
      - inference
    command: ["bash", "-lc", "./gradlew bootRun"]

  inference:
    image: python:3.12-slim
    container_name: portmatch-inference
    working_dir: /app/Inference
    volumes:
      - ./Inference:/app/Inference
    env_file:
      - .env.prod
    ports:
      - "8104:8001"
    command: ["bash", "-lc", "pip install -r requirements.txt && uvicorn web.api.app:app --host 0.0.0.0 --port 8001"]

  portfolio-analysis:
    image: python:3.12-slim
    container_name: portmatch-portfolio-analysis
    working_dir: /app/Portfolio-Analysis
    volumes:
      - ./Portfolio-Analysis:/app/Portfolio-Analysis
    env_file:
      - .env.prod
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8103:8000"
    command: ["bash", "-lc", "pip install -r requirements.txt && uvicorn web.api.app:app --host 0.0.0.0 --port 8000"]

  frontend:
    container_name: portmatch-frontend
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_SERVICE_NAME: ${VITE_SERVICE_NAME}
    ports:
      - "8101:80"
    depends_on:
      - backend

volumes:
  postgres-data:
