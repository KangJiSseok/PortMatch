version: "3.8"

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: portmatch-db
    restart: always
    ports:
      - "8100:5432"
    env_file:
      - .env.prod
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    image: ${BACKEND_IMAGE:-kangjiseok/portmatch-backend:latest}
    container_name: portmatch-backend-prod
    restart: always

    environment:
      - OPENVIDU_URL=http://openvidu-server:4443
      - OPENVIDU_SECRET=MY_SECRET
      
    env_file:
      - .env.prod
    ports:
      - "8102:8080"
    depends_on:
      - db
      - portfolio-analysis
      - inference
      - explanation-llm

  inference:
    image: ${INFERENCE_IMAGE:-kangjiseok/portmatch-inference:latest}
    container_name: portmatch-inference-prod
    restart: always
    env_file:
      - .env.prod
    ports:
      - "8104:8001"
    depends_on:
      - db

  portfolio-analysis:
    image: ${PORTFOLIO_IMAGE:-kangjiseok/portmatch-portfolio-analysis:latest}
    container_name: portmatch-portfolio-analysis-prod
    restart: always
    env_file:
      - .env.prod
    ports:
      - "8103:8000"
    depends_on:
      - db

  embedding:
    image: ${EMBEDDING_IMAGE:-kangjiseok/portmatch-embedding:latest}
    container_name: portmatch-embedding-prod
    restart: always
    env_file:
      - .env.prod
    ports:
      - "8105:8002"
    depends_on:
      - db

  explanation-llm:
    image: ${EXPLANATION_IMAGE:-kangjiseok/portmatch-explanation-llm:latest}
    container_name: portmatch-explanation-llm-prod
    restart: always
    env_file:
      - .env.prod
    ports:
      - "8106:8003"
    depends_on:
      - db

  frontend:
    image: ${FRONTEND_IMAGE:-kangjiseok/portmatch-frontend:latest}
    container_name: portmatch-frontend-prod
    restart: always
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - openvidu-server

  openvidu-server:
    image: openvidu/openvidu-dev:2.30.0
    container_name: openvidu-server
    restart: always
    ports:
      - "5443:5443"
      - "8443:4443"
    environment:
      - HTTP_PORT=5443
      - OPENVIDU_HTTPS_PORT=4443
      - OPENVIDU_SECRET=MY_SECRET
      - DOMAIN_OR_PUBLIC_IP=i14d205.p.ssafy.io
      - WITH_KMS=http://localhost:8888/kurento
      - OPENVIDU_HTTPS_PORT=443
      - OPENVIDU_SESSIONS_GARBAGE_INTERVAL=900       
      - OPENVIDU_SESSIONS_GARBAGE_THRESHOLD=3600     
      - OPENVIDU_SESSIONS_GARBAGE_INTERVAL_LAST_PARTICIPANT=900
      - OPENVIDU_WEBHOOK=true
      - OPENVIDU_WEBHOOK_ENDPOINT=http://portmatch-backend-prod:8080/api/interview/webhook
      - OPENVIDU_WEBHOOK_EVENTS=["sessionDestroyed","participantJoined","participantLeft"]      

  certbot:
    image: certbot/certbot:latest
    container_name: portmatch-certbot
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM; while :; do sleep 12h & wait $${!}; certbot renew --webroot -w /var/www/certbot --quiet; done"

volumes:
  postgres-data:
  letsencrypt:
  certbot-www:
