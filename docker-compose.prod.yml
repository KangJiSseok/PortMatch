version: "3.8"

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: portmatch-db
    restart: always
    ports:
      - "8100:5432"
    env_file:
      - .env.prod
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    image: ${BACKEND_IMAGE:-kangjiseok/portmatch-backend:latest}
    container_name: portmatch-backend-prod
    restart: always

    environment:
      - OPENVIDU_URL=https://openvidu-server:8443/
      - OPENVIDU_SECRET=MY_SECRET
      - EXPLANATION_URL=http://explanation-llm:8003
      
    env_file:
      - .env.prod
    ports:
      - "8102:8080"
    depends_on:
      - db
      - portfolio-analysis
      - inference
      - explanation-llm

  inference:
    image: ${INFERENCE_IMAGE:-kangjiseok/portmatch-inference:latest}
    container_name: portmatch-inference-prod
    restart: always
    env_file:
      - .env.prod
    ports:
      - "8104:8001"
    depends_on:
      - db

  portfolio-analysis:
    image: ${PORTFOLIO_IMAGE:-kangjiseok/portmatch-portfolio-analysis:latest}
    container_name: portmatch-portfolio-analysis-prod
    restart: always
    env_file:
      - .env.prod
    ports:
      - "8103:8000"
    depends_on:
      - db

  embedding:
    image: ${EMBEDDING_IMAGE:-kangjiseok/portmatch-embedding:latest}
    container_name: portmatch-embedding-prod
    restart: always
    env_file:
      - .env.prod
    ports:
      - "8105:8002"
    depends_on:
      - db

  explanation-llm:
    image: ${EXPLANATION_IMAGE:-kangjiseok/portmatch-explanation-llm:latest}
    container_name: portmatch-explanation-llm-prod
    restart: always
    env_file:
      - .env.prod
    ports:
      - "8106:8003"
    depends_on:
      - db

  frontend:
    image: ${FRONTEND_IMAGE:-kangjiseok/portmatch-frontend:latest}
    container_name: portmatch-frontend-prod
    restart: always
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - openvidu-server

  openvidu-server:
    image: openvidu/openvidu-server:2.30.0
    container_name: openvidu-server
    restart: always
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
    ports:
      - "5443:5443"
      - "8443:8443"
    environment:
      - OPENVIDU_SECRET=MY_SECRET
      - DOMAIN_OR_PUBLIC_IP=i14d205.p.ssafy.io
      - OPENVIDU_HTTPS_PORT=8443
      - HTTPS_PORT=8443
      - CERTIFICATE_TYPE=owncert
      - OWNCERT_CRT=/etc/letsencrypt/live/i14d205.p.ssafy.io/fullchain.pem
      - OWNCERT_KEY=/etc/letsencrypt/live/i14d205.p.ssafy.io/privkey.pem
      - OPENVIDU_PRO_LICENSE=
      - KMS_URIS=["ws://kurento:8888/kurento"]
      - OPENVIDU_SESSIONS_GARBAGE_INTERVAL=900
      - OPENVIDU_SESSIONS_GARBAGE_THRESHOLD=3600
      - OPENVIDU_WEBHOOK=true
      - OPENVIDU_WEBHOOK_ENDPOINT=http://portmatch-backend-prod:8080/api/interview/webhook
      - OPENVIDU_WEBHOOK_EVENTS=["sessionDestroyed", "participantJoined", "participantLeft"]
  
  kurento:
    image: kurento/kurento-media-server:7.0.1
    container_name: kurento
    restart: always
    ports:
      - "8888:8888"

  certbot:
    image: certbot/certbot:latest
    container_name: portmatch-certbot
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM; while :; do sleep 12h & wait $${!}; certbot renew --webroot -w /var/www/certbot --quiet; done"

volumes:
  postgres-data:
  letsencrypt:
  certbot-www:
