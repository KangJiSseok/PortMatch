version: "3.8"

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: portmatch-db
    restart: always
    ports:
      - "8100:5432"
    env_file:
      - .env.prod
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    image: ${BACKEND_IMAGE:-kangjiseok/portmatch-backend:latest}
    container_name: portmatch-backend-prod
    restart: always
    env_file:
      - .env.prod
    ports:
      - "8102:8080"
    depends_on:
      - db
      - portfolio-analysis
      - inference

  inference:
    image: ${INFERENCE_IMAGE:-kangjiseok/portmatch-inference:latest}
    container_name: portmatch-inference-prod
    restart: always
    env_file:
      - .env.prod
    ports:
      - "8104:8001"
    depends_on:
      - db

  portfolio-analysis:
    image: ${PORTFOLIO_IMAGE:-kangjiseok/portmatch-portfolio-analysis:latest}
    container_name: portmatch-portfolio-analysis-prod
    restart: always
    env_file:
      - .env.prod
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8103:8000"
    depends_on:
      - db

  embedding:
    image: ${EMBEDDING_IMAGE:-kangjiseok/portmatch-embedding:latest}
    container_name: portmatch-embedding-prod
    restart: always
    env_file:
      - .env.prod
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8105:8002"
    depends_on:
      - db

  frontend:
    image: ${FRONTEND_IMAGE:-kangjiseok/portmatch-frontend:latest}
    container_name: portmatch-frontend-prod
    restart: always
    ports:
      - "8101:80"
    depends_on:
      - backend

volumes:
  postgres-data:
