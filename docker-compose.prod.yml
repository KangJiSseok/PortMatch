version: "3.8"

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: portmatch-db
    networks:
      - portmatch-network
    restart: always
    ports:
      - "8100:5432"
    env_file:
      - .env.prod
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    image: ${BACKEND_IMAGE:-kangjiseok/portmatch-backend:latest}
    container_name: portmatch-backend-prod
    networks:
      - portmatch-network
    restart: always

    environment:
      - EXPLANATION_URL=http://explanation-llm:8003

    env_file:
      - .env.prod
    volumes:
      - ./logs/backend:/app/logs
    ports:
      - "8102:8080"
    depends_on:
      - db
      - portfolio-analysis
      - inference
      - explanation-llm

  inference:
    image: ${INFERENCE_IMAGE:-kangjiseok/portmatch-inference:latest}
    container_name: portmatch-inference-prod
    networks:
      - portmatch-network
    restart: always
    env_file:
      - .env.prod
    ports:
      - "8104:8001"
    depends_on:
      - db

  portfolio-analysis:
    image: ${PORTFOLIO_IMAGE:-kangjiseok/portmatch-portfolio-analysis:latest}
    container_name: portmatch-portfolio-analysis-prod
    networks:
      - portmatch-network
    restart: always
    env_file:
      - .env.prod
    ports:
      - "8103:8000"
    depends_on:
      - db

  portfolio-analysis-test:
    image: ${PORTFOLIO_IMAGE:-kangjiseok/portmatch-portfolio-analysis:latest}
    container_name: portmatch-portfolio-analysis-test
    networks:
      - portmatch-network
    restart: always
    command: uvicorn web.api.app:app --host 0.0.0.0 --port 8000
    environment:
      - REDIS_HOST=redis  # 컨테이너 이름과 일치
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/0
      - USE_CELERY=true
    env_file:
      - .env.prod
    ports:
      - "8107:8000"
    depends_on:
      - db
      - redis

  celery-worker-test:
    image: ${PORTFOLIO_IMAGE:-kangjiseok/portmatch-portfolio-analysis:latest}
    container_name: portmatch-celery-worker-test
    network_mode: "host"
    restart: always
    # 워커가 동시에 처리할 작업 수(concurrency)를 명시적으로 지정하면 자원 관리가 쉬워져!
    command: python -m celery -A web.api.celery_app worker --loglevel=info --concurrency=2
    environment:
      - REDIS_HOST=127.0.0.1
      - REDIS_PORT=8379       # 아까 Redis 설정에서 8379로 뚫어놨지? 그 포트야.
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@127.0.0.1:8379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@127.0.0.1:8379/0
      - MINERU_ENDPOINT=http://127.0.0.1:18001/file_parse
      - MINERU_ENDPOINTS=http://127.0.0.1:18001/file_parse
    env_file:
      - .env.prod
    extra_hosts:
      - "host.docker.internal:host-gateway"  # 호스트 접근 가능
    depends_on:
      - redis
      - db

  embedding:
    image: ${EMBEDDING_IMAGE:-kangjiseok/portmatch-embedding:latest}
    container_name: portmatch-embedding-prod
    networks:
      - portmatch-network
    restart: always
    env_file:
      - .env.prod
    ports:
      - "8105:8002"
    depends_on:
      - db

  explanation-llm:
    image: ${EXPLANATION_IMAGE:-kangjiseok/portmatch-explanation-llm:latest}
    container_name: portmatch-explanation-llm-prod
    networks:
      - portmatch-network
    restart: always
    env_file:
      - .env.prod
    ports:
      - "8106:8003"
    depends_on:
      - db

  frontend:
    image: ${FRONTEND_IMAGE:-kangjiseok/portmatch-frontend:latest}
    container_name: portmatch-frontend-prod
    networks:
      - portmatch-network
    restart: always
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - peerjs-server

  peerjs-server:
    image: peerjs/peerjs-server
    container_name: peerjs-server
    networks:
      - portmatch-network
    restart: always
    ports:
      - "9000:9000"
    command: ["npm", "start", "--", "--port", "9000"]

  certbot:
    image: certbot/certbot:latest
    container_name: portmatch-certbot
    networks:
      - portmatch-network
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM; while :; do sleep 12h & wait $${!}; certbot renew --webroot -w /var/www/certbot --quiet; done"

  wanted-crawler:
    image: ${CRAWLER_IMAGE:-kangjiseok/portmatch-wanted-crawler:latest}
    container_name: portmatch-wanted-crawler
    networks:
      - portmatch-network
    profiles: ['crawler']
    env_file:
      - .env.prod
    depends_on:
      - db
    restart: "no"

  redis:
    image: redis:7-alpine
    container_name: portmatch-redis
    networks:
      - portmatch-network
    restart: always
    ports:
      - "8379:6379"
    env_file:
      - .env.prod
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    networks:
      - portmatch-network
    restart: unless-stopped
    ports:
      - "8050:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    networks:
      - portmatch-network
    restart: unless-stopped
    ports:
      - "8051:3000"
    env_file:
      - .env.prod
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

networks:
  portmatch-network:
    name: portmatch-shared-network
    driver: bridge
    external: true

volumes:
  postgres-data:
  letsencrypt:
  certbot-www:
  redis-data:
  prometheus-data:
  grafana-data: