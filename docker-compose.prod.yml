version: "3.8"

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: portmatch-db
    restart: always
    ports:
      - "8100:5432"
    env_file:
      - .env.prod
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    image: ${BACKEND_IMAGE:-kangjiseok/portmatch-backend:latest}
    container_name: portmatch-backend-prod
    restart: always

    environment:
      - EXPLANATION_URL=http://explanation-llm:8003
      
    env_file:
      - .env.prod
    volumes:
      - ./logs/backend:/app/logs
    ports:
      - "8102:8080"
    depends_on:
      - db
      - portfolio-analysis
      - inference
      - explanation-llm

  inference:
    image: ${INFERENCE_IMAGE:-kangjiseok/portmatch-inference:latest}
    container_name: portmatch-inference-prod
    restart: always
    env_file:
      - .env.prod
    ports:
      - "8104:8001"
    depends_on:
      - db

  portfolio-analysis:
    image: ${PORTFOLIO_IMAGE:-kangjiseok/portmatch-portfolio-analysis:latest}
    container_name: portmatch-portfolio-analysis-prod
    restart: always
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    env_file:
      - .env.prod
    ports:
      - "8103:8000"
    depends_on:
      - db
      - redis

  celery-worker:
    image: ${PORTFOLIO_IMAGE:-kangjiseok/portmatch-portfolio-analysis:latest}
    container_name: portmatch-celery-worker
    restart: always
    command: celery -A web.api.celery_app worker --loglevel=info
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    env_file:
      - .env.prod
    depends_on:
      - redis
      - db

  embedding:
    image: ${EMBEDDING_IMAGE:-kangjiseok/portmatch-embedding:latest}
    container_name: portmatch-embedding-prod
    restart: always
    env_file:
      - .env.prod
    ports:
      - "8105:8002"
    depends_on:
      - db

  explanation-llm:
    image: ${EXPLANATION_IMAGE:-kangjiseok/portmatch-explanation-llm:latest}
    container_name: portmatch-explanation-llm-prod
    restart: always
    env_file:
      - .env.prod
    ports:
      - "8106:8003"
    depends_on:
      - db

  frontend:
    image: ${FRONTEND_IMAGE:-kangjiseok/portmatch-frontend:latest}
    container_name: portmatch-frontend-prod
    restart: always
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - peerjs-server

  peerjs-server:
    image: peerjs/peerjs-server
    container_name: peerjs-server
    restart: always
    ports:
      - "9000:9000"
    command: ["npm", "start", "--", "--port", "9000"]

  certbot:
    image: certbot/certbot:latest
    container_name: portmatch-certbot
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM; while :; do sleep 12h & wait $${!}; certbot renew --webroot -w /var/www/certbot --quiet; done"

  wanted-crawler:
    image: ${CRAWLER_IMAGE:-kangjiseok/portmatch-wanted-crawler:latest}
    container_name: portmatch-wanted-crawler
    profiles: ['crawler']
    env_file:
      - .env.prod
    depends_on:
      - db
    restart: "no"

  redis:
    image: redis:7-alpine
    container_name: portmatch-redis
    restart: always
    ports:
      - "8379:6379"  # 중요: 로컬 컴퓨터가 접속하려면 포트 포워딩이 필요해!
    env_file:
      - .env.prod
    command: redis-server --requirepass ${REDIS_PASSWORD} # 보안을 위해 비번 설정 권장
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  letsencrypt:
  certbot-www:
  redis-data:
