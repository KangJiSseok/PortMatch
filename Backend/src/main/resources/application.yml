server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver


  sql:
    init:
      mode: never

  jpa:
    defer-datasource-initialization: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

  flyway:
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

aws:
  s3:
    bucket: ${AWS_S3_BUCKET}
    region: ${AWS_REGION}
    access-key: ${AWS_ACCESS_KEY}
    secret-key: ${AWS_SECRET_KEY}

portfolio-analysis:
  base-url: ${PORTFOLIO_ANALYSIS_URL:http://localhost:8000}

company-project-analysis:
  base-url: ${COMPANY_PROJECT_ANALYSIS_URL:http://localhost:8001}

explanation:
  base-url: ${EXPLANATION_URL:http://localhost:8003}

company-embedding:
  base-url: ${EMBEDDING_URL:http://localhost:8002}
  model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}

portfolio-embedding:
  base-url: ${EMBEDDING_URL:http://localhost:8002}
  model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}

springdoc:
  override-with-generic-response: false

embedding-v3:
  base-url: http://localhost:8002

openvidu:
  url: ${OPENVIDU_URL:https://i14d205.p.ssafy.io/openvidu}
  secret: ${OPENVIDU_SECRET:MY_SECRET}
